<style>
      /* Footer */
    .tm-footer{
      background: radial-gradient(1200px 300px at center top, #1f2937 0%, #0b1220 55%, #020617 100%);
      padding: 56px 16px 26px;
      margin-top: 42px;
    }
 .tm-footer__inner{
    max-width: 72rem; /* ~ max-w-6xl */
    margin: 0 auto;
    text-align:center;
  }  
  .tm-footer__social{
      display:flex;
      justify-content:center;
      gap:18px;
      margin-bottom:26px;
      flex-wrap:wrap;
    }
   .tm-footer__icon{
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display:grid;
    place-items:center;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.14);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .tm-footer__icon:hover{
      transform: translateY(-3px);
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 18px 38px rgba(0,0,0,.6);
    }
     .tm-footer__icon img{
    width: 18px;
    height: 18px;
    object-fit: contain;
    filter: brightness(0) invert(1); /* vuelve los iconos blancos */
    opacity: .95;
        
    }
    
    
    .tm-footer__line{
      height:1px; max-width:860px; margin:0 auto 14px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.25), transparent);
    }
    .tm-footer__copy{
      margin:0;
      font-size:13px;
      color: rgba(226,232,240,.9);
      font-family:var(--font-body);
    }
.tm-footer__copy a{
      color: rgba(64,224,208,.95);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight:800;
    }
    .nav a img {
      transition: transform 0.2s;
      transform-origin: center;
    }
    .nav a:hover img {
      transform: rotate(-6deg) scale(1.05);
    }

</style>
