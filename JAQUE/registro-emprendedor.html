  <html lang="es-CR">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Emprendedor — TuyoMall</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  
 <script src="https://cdn.tailwindcss.com"></script>
 
  <style>
    :root{
      --bg-primary:#6366f1;
      --bg-secondary:#8b5cf6;
      --surface:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --primary-action:#4f46e5;
      --secondary-action:#10b981;
      --border:#e5e7eb;
      --shadow: 0 12px 30px rgba(2, 6, 23, .10);
      --radius:16px;
      --max: 1100px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    *{ box-sizing:border-box; }
    .body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:#f8fafc;
    }
    .a{ color:inherit; text-decoration:none; }
    .container{ max-width:var(--max); margin:0 auto; padding:0 18px; }

    /* Header */
    .header{
      background:var(--surface);
      border-bottom:1px solid var(--border);
      { margin-top: 5px; /* mueve hacia abajo */ 
     
    }
    .nav{
      height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand img{ height:48px; width:auto; display:block; }
    .brand:hover img,
    .nav a:hover img {
      transform: rotate(-6deg) scale(1.05);
    }
    .brand img,
    .nav a img {
      transition: transform 0.2s;
      transform-origin: center;
    }
    .menu{
      display:flex;
      align-items:center;
      gap:18px;
      font-size:13px;
      font-weight:600;
      color:#111827;
    }
    .menu a{
      padding:8px 10px;
      border-radius:10px;
    }
    .menu a:hover{ background:#f1f5f9; }

    .dropdown{ position:relative; }
    .dropbtn{
      border:none; background:transparent; cursor:pointer;
      font:inherit; color:inherit;
      padding:8px 10px; border-radius:10px;
      display:flex; align-items:center; gap:6px;
    }
    .dropbtn:hover{ background:#f1f5f9; }
    .dropmenu{
      position:absolute; top:44px; right:0;
      min-width:210px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow: var(--shadow);
      padding:10px;
      display:none;
      z-index:10;
    }
    .dropmenu a{
      display:block;
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
    }
    .dropmenu a:hover{ background:#f1f5f9; }

    .actions{ display:flex; gap:10px; align-items:center; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      border:1px solid transparent;
      transition: transform .15s ease, opacity .15s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn-green{ background:var(--secondary-action); color:#fff; }
    .btn-purple{ background:var(--primary-action); color:#fff; }
    .btn-ghost{ background:transparent; border-color:var(--border); color:#111827; }

    /* Hero strip (estética imagen 3) */
    .hero{
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
      padding: 46px 0;
    }
    .hero h1{
      margin:0;
      color:#fff;
      font-size: 22px;
      font-weight: 900;
      text-align:center;
      letter-spacing:.2px;
    }
    .hero p{
      margin:8px 0 0;
      color: rgba(255,255,255,.92);
      font-size: 13px;
      text-align:center;
    }

    /* Card login */
    .wrap{
      padding: 34px 0 40px;
    }
    .card{
      max-width: 860px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid #eef2f7;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .badge{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      background:#111827;
      color:#fff;
      font-size:11px;
      font-weight:800;
      margin-bottom:10px;
    }
    .title{
      margin:0 0 6px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing:.2px;
    }
    .subtitle{
      margin:0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.5;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items:end;
    }
    .field label{
      display:block;
      font-size:12px;
      font-weight:800;
      margin-bottom:6px;
      color:#0f172a;
    }
    .field input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline:none;
      font-size: 13px;
      transition: box-shadow .15s ease, border-color .15s ease;
      background:#fff;
    }
    .field input:focus{
      border-color: rgba(79,70,229,.55);
      box-shadow: 0 0 0 4px rgba(79,70,229,.14);
    }

    .row-actions{
      display:flex;
      gap:12px;
      align-items:center;
      margin-top: 14px;
      flex-wrap:wrap;
    }
    .btn-enter{
      background: #b7d70a; /* verde limón tipo tu marca */
      color:#0b1220;
      border:none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 12px;
      cursor:pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    .btn-enter:hover{ transform: translateY(-1px); filter: brightness(0.98); }

    .btn-link{
      background: transparent;
      border: 1px solid rgba(79,70,229,.35);
      color:#0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .help{
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height:1.8;
    }
    .help a{
      color: var(--primary-action);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

   /* ===== FOOTER ===== */
  .tm-footer{
    background:#111827;
    color:#cbd5e1;
    padding: 48px 16px 28px;
    margin-top: 80px;
  }
  .tm-footer__inner{
    max-width: 72rem; /* ~ max-w-6xl */
    margin: 0 auto;
    text-align:center;
  }
  .tm-footer__social{
    display:flex;
    justify-content:center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tm-footer__icon{
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display:grid;
    place-items:center;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.14);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .tm-footer__icon:hover{
    transform: translateY(-2px);
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.22);
  }
  .tm-footer__icon img{
    width: 18px;
    height: 18px;
    object-fit: contain;
    filter: brightness(0) invert(1); /* vuelve los iconos blancos */
    opacity: .95;
  }
  .tm-footer__line{
    height: 1px;
    max-width: 720px;
    margin: 0 auto 14px;
    background: rgba(255,255,255,.14);
  }
    .tm-footer__copy{
      margin:0;
      font-size:13px;
      color: rgba(226,232,240,.9);
      font-family:var(--font-body);
    }
    .tm-footer__copy a{
      color: rgba(64,224,208,.95);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight:800;
    }
   /* Responsive */
    @media (max-width: 1100px){
      .catalog{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .home-grid{ grid-template-columns: 260px 1fr 260px; }
    }
    @media (max-width: 860px){
      .home-grid{ grid-template-columns: 1fr; }
      .catalog{ grid-template-columns: 1fr; }
      .hero h1{ font-size:30px; }
      .menu{ justify-content:flex-end; }
    }
    @media (max-width: 640px){
      .nav{
        height: auto;
        padding: 10px 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .menu{
        width: 100%;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dropmenu{
        right: auto;
        left: 50%;
        transform: translateX(-50%);
        min-width: 88vw;
      }
      .card{ padding: 18px 14px; }
      .title{ font-size: 22px; }
      .grid{ grid-template-columns: 1fr; }
      .row-actions > *{ width: 100%; text-align: center; }
    }
  </style>

<body class=" h-full overflow-auto" style="background:var(--surface); color:var(--text); font-family: var(--font);">
    
  <header class="site-header" role="navigation" aria-label="Barra superior">
    <div class="container nav">
       <a href="new-index.html" class="flex items-center">

      </nav>
    </div>
  </header>
  <main class="container" style="max-width:720px">
    <div class="card" style="padding:16px 18px;">
      <h1 style="margin:6px 0 8px 0; font-weight:bold; font-size:32px;"> Crear cuenta de Emprendedor </h1>
      <p class="hint">Registrate como emprendedor para subir tus articulos y obtener clientes.</p>

      <form id="registerClientForm" class="form" novalidate>
        <div class="row row-2">
          <div>
            <label for="firstName">Nombres*</label>
            <input id="firstName" name="firstName" required />
          </div>
          <div>
            <label for="lastName">Apellidos*</label>
            <input id="lastName" name="lastName" required />
          </div>
        </div>

        <div class="row row-2">
          <div>
            <label for="email">Email*</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div>
            <label for="password">Contrasena*</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="mínimo 8 caracteres" />
          </div>
        </div>

        <div class="row row-2">
          <div>
            <label for="country">País*</label>
            <select id="country" name="country" required>
              <option value="" disabled selected>País…</option>
              <option>Argentina</option><option>Bolivia</option><option>Chile</option><option>Colombia</option>
              <option>Costa Rica</option><option>Ecuador</option><option>El Salvador</option><option>Guatemala</option>
              <option>Haití</option><option>Honduras</option><option>México</option><option>Nicaragua</option>
              <option>Panamá</option><option>Paraguay</option><option>Perú</option>
              <option>República Dominicana</option><option>Uruguay</option>
            </select>
          </div>
          <div>
            <label for="age">Edad*</label>
            <input id="age" name="age" type="number" min="18" required placeholder="18+" />
          </div>
        </div>

        <!-- Honeypot anti-bot -->
        <div class="sr-only" aria-hidden="true">
          <label for="company">Empresa</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <label class="consent" style="margin-top:8px;">
          <input id="agree" type="checkbox" required />
          <span>Acepto las condiciones de uso y privacidad.</span>
        </label>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Crear cuenta</button>
          <a class="btn btn-outline" href="acceso-cliente.html">Ya tengo cuenta</a>
        </div>
        <p id="registerClientAlert" class="hint" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p class="copy">© <span id="year"></span> TuyoMall</p>
  </footer>

  <script src="assets/js/main.js?v=4" defer></script>
  <script src="assets/js/auth/auth-utils.js?v=4" defer></script>
  <script src="assets/js/auth/header-state.js?v=4" defer></script>
  <!-- Nuevo JS de registro cliente (MySQL + perfil) -->
  <script src="assets/js/pages/registro-cliente.js?v=5" defer></script>
</body>
</html>

<script>
  // Año
  document.getElementById('year').textContent = new Date().getFullYear();

  // Dropdown
  const btn = document.getElementById('categoriesBtn');
  const menu = document.getElementById('categoriesMenu');
  if (btn && menu) {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const open = menu.style.display === 'block';
      menu.style.display = open ? 'none' : 'block';
      btn.setAttribute('aria-expanded', String(!open));
    });
    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !menu.contains(e.target)) {
        menu.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        menu.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }
</script>
