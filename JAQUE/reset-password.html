<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png?v=3">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96.png?v=3">
<link rel="icon" type="image/png" sizes="144x144" href="/assets/img/favicon-144.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png?v=3">
<link rel="manifest" href="/site.webmanifest?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña | TuyoMall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --coral:#FF6B47; --navy:#14213D; --dark:#070D15; --panel:#121C2A; --line:rgba(255,255,255,0.14); --muted:#9AA8BA; }
body {
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background:
    linear-gradient(135deg, rgba(255,107,71,0.14), transparent 34%),
    linear-gradient(135deg, var(--dark), #0D1726);
  color: white;
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  width: min(440px, 100%);
  background: rgba(18,28,42,0.94);
  border: 1px solid var(--line);
  border-top: 4px solid var(--coral);
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 28px 80px rgba(0,0,0,0.28);
}
.icon {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  color: var(--coral);
  background: rgba(255,107,71,0.1);
  font-size: 28px;
  margin-bottom: 18px;
}
h1 { font-size: 30px; line-height: 1.05; margin-bottom: 10px; }
p { color: #CBD5E1; line-height: 1.55; margin-bottom: 22px; }
label { display: block; font-size: 13px; font-weight: 800; margin: 14px 0 7px; }
input {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #0B131E;
  color: white;
  padding: 0 14px;
  font: inherit;
  outline: none;
}
input:focus { border-color: rgba(255,107,71,0.7); box-shadow: 0 0 0 3px rgba(255,107,71,0.12); }
.btn {
  width: 100%;
  min-height: 52px;
  border: none;
  border-radius: 999px;
  margin-top: 18px;
  background: var(--coral);
  color: white;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn:disabled { opacity: 0.7; cursor: not-allowed; }
.ghost {
  display: flex;
  justify-content: center;
  margin-top: 14px;
  color: #CBD5E1;
  font-weight: 700;
  text-decoration: none;
}
.alert {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border-radius: 14px;
  font-size: 13px;
  background: rgba(255,107,71,0.12);
  color: #FFD6C8;
}
.alert.show { display: block; }
.alert.ok { background: rgba(34,197,94,0.12); color: #BBF7D0; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon"><span class="ti ti-lock-check"></span></div>
    <h1>Creá una nueva contraseña</h1>
    <p>Usá una contraseña segura de al menos 8 caracteres. Este enlace solo se puede usar una vez.</p>
    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password" minlength="8" required placeholder="Mínimo 8 caracteres">
      <label for="passwordConfirm">Confirmar contraseña</label>
      <input id="passwordConfirm" name="password_confirm" type="password" minlength="8" required placeholder="Repetí tu contraseña">
      <button class="btn" id="resetButton" type="submit"><span class="ti ti-check"></span> Actualizar contraseña</button>
      <p class="alert" id="resetAlert" role="status"></p>
    </form>
    <a class="ghost" id="backLogin" href="acceso-cliente.html">Volver al inicio de sesión</a>
  </main>

<script>
const form = document.getElementById('resetForm');
const alertBox = document.getElementById('resetAlert');
const button = document.getElementById('resetButton');
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const role = params.get('role') === 'emprendedor' ? 'emprendedor' : 'cliente';
const loginUrl = role === 'emprendedor' ? 'acceso-emprendedor.html' : 'acceso-cliente.html';
document.getElementById('backLogin').href = loginUrl;

function showMessage(message, ok = false) {
  alertBox.textContent = message;
  alertBox.classList.toggle('ok', ok);
  alertBox.classList.add('show');
}

if (!token) {
  button.disabled = true;
  showMessage('El enlace no tiene token. Solicitá uno nuevo.');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;

  if (password.length < 8) {
    showMessage('La contraseña debe tener mínimo 8 caracteres.');
    return;
  }
  if (password !== passwordConfirm) {
    showMessage('Las contraseñas no coinciden.');
    return;
  }

  button.disabled = true;
  button.innerHTML = '<span class="ti ti-loader-2"></span> Actualizando...';

  try {
    const data = new FormData();
    data.append('token', token);
    data.append('password', password);
    data.append('password_confirm', passwordConfirm);

    const response = await fetch('auth/reset-password.php', { method: 'POST', body: data });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.message || 'No se pudo actualizar la contraseña.');

    form.reset();
    showMessage(result.message, true);
    button.innerHTML = '<span class="ti ti-check"></span> Contraseña actualizada';
    setTimeout(() => { window.location.href = loginUrl; }, 1600);
  } catch (error) {
    showMessage(error.message || 'No se pudo actualizar la contraseña.');
    button.disabled = false;
    button.innerHTML = '<span class="ti ti-check"></span> Actualizar contraseña';
  }
});
</script>
</body>
</html>
