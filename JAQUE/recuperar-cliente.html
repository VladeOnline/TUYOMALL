<!DOCTYPE html>
<html lang="es-CR">
<head>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png?v=3">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96.png?v=3">
<link rel="icon" type="image/png" sizes="144x144" href="/assets/img/favicon-144.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png?v=3">
<link rel="manifest" href="/site.webmanifest?v=3">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contrasena cliente | TuyoMall</title>
  <meta name="theme-color" content="#FF6B47">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --coral: #FF6B47;
      --navy: #14213D;
      --white: #FFFFFF;
      --paper: #F7F4EF;
      --muted: #667085;
      --line: rgba(20,33,61,0.12);
      --success: #10B981;
      --shadow: 0 24px 80px rgba(7,17,28,0.14);
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 16% 18%, rgba(255,107,71,0.14), transparent 28%),
        linear-gradient(135deg, #FFFFFF 0%, var(--paper) 48%, #101A27 48.1%, #07111C 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(22px, 5vw, 72px);
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--navy);
      font-family: 'Clash Display', sans-serif;
      font-size: 22px;
      font-weight: 700;
      animation: dropIn 0.65s cubic-bezier(.2,.8,.2,1) both;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--coral);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 26px rgba(255,107,71,0.28);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .brand:hover .brand-mark { transform: rotate(-6deg) scale(1.05); }
    .brand-mark img { width: 58px; height: 58px; object-fit: contain; }
    .brand-mall { color: var(--coral); position: relative; display: inline-block; }
    .brand-underline { position: absolute; left: 3px; right: 0; bottom: -9px; width: 100%; height: 7px; }

    .top-actions { display: flex; align-items: center; gap: 10px; }

    .ghost-link,
    .theme-toggle {
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(20,33,61,0.14);
      background: rgba(255,255,255,0.68);
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(14px);
    }

    .theme-toggle { width: 42px; padding: 0; }

    .wrap {
      width: min(980px, calc(100% - 40px));
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      padding: clamp(70px, 8vh, 118px) 0 72px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 36px;
      align-items: center;
    }

    .copy {
      animation: riseIn 0.8s 0.08s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 0.96;
      letter-spacing: -1px;
      color: var(--navy);
      margin-bottom: 20px;
    }

    h1 span { color: var(--coral); }

    .lead {
      max-width: 520px;
      color: #475467;
      font-size: 18px;
      line-height: 1.7;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.58);
      box-shadow: var(--shadow);
      padding: 30px;
      animation: cardReveal 0.86s 0.18s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, var(--coral), #FFB199);
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #111827;
      color: var(--coral);
      display: grid;
      place-items: center;
      font-size: 30px;
      margin-bottom: 20px;
      animation: pulseGlow 2.8s ease-in-out infinite;
    }

    .card h2 {
      font-family: 'Clash Display', sans-serif;
      font-size: 30px;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .card p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 15px;
      border: 1px solid var(--line);
      background: #FFFFFF;
      color: var(--navy);
      font: inherit;
      padding: 0 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 14px;
    }

    input::placeholder {
      color: #98A2B3;
      opacity: 1;
    }

    input:focus {
      border-color: rgba(255,107,71,0.58);
      box-shadow: 0 0 0 4px rgba(255,107,71,0.12);
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .btn {
      min-height: 50px;
      border-radius: 15px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--coral);
      color: #FFFFFF;
      box-shadow: 0 16px 32px rgba(255,107,71,0.28);
    }

    .btn-ghost {
      background: transparent;
      color: var(--navy);
      border: 1px solid rgba(20,33,61,0.16);
    }

    .alert {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(16,185,129,0.12);
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .alert.show { display: block; animation: popIn 0.35s ease both; }

    html.tm-dark body,
    body.dark-mode {
      background:
        radial-gradient(circle at 18% 18%, rgba(255,107,71,0.18), transparent 28%),
        linear-gradient(135deg, #070D14 0%, #0B1118 48%, #111827 48.1%, #0B1118 100%) !important;
    }

    html.tm-dark .brand,
    html.tm-dark h1,
    html.tm-dark .card h2,
    html.tm-dark label {
      color: #F8FAFC !important;
    }

    html.tm-dark .lead,
    html.tm-dark .card p {
      color: #CBD5E1 !important;
    }

    html.tm-dark .eyebrow,
    html.tm-dark h1 span,
    html.tm-dark .brand-mall {
      color: #FF7A59 !important;
    }

    html.tm-dark .ghost-link,
    html.tm-dark .theme-toggle,
    html.tm-dark .card {
      background: rgba(23,32,43,0.86) !important;
      border-color: rgba(255,255,255,0.12) !important;
    }

    html.tm-dark input {
      background: #0F1720 !important;
      color: #F8FAFC !important;
      border-color: rgba(255,255,255,0.14) !important;
    }

    html.tm-dark input::placeholder {
      color: #D7DEE9 !important;
      opacity: 1;
    }

    html.tm-dark .btn-ghost {
      color: #F8FAFC !important;
      border-color: rgba(255,255,255,0.16) !important;
    }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translateY(0); box-shadow: 0 18px 34px rgba(17,24,39,0.18); }
      50% { transform: translateY(-3px); box-shadow: 0 24px 46px rgba(255,107,71,0.28); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 820px) {
      body {
        background: linear-gradient(180deg, #FFFFFF 0%, var(--paper) 58%, #07111C 58.1%, #07111C 100%);
      }

      .topbar { height: auto; padding-top: 18px; }
      .wrap { grid-template-columns: 1fr; padding-top: 36px; }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 28px, 980px); }
      .ghost-link span:not(.ti) { display: none; }
      .ghost-link { width: 42px; padding: 0; }
      .card { padding: 24px; }
    }
  </style>
  <script src="assets/js/theme.js?v=20260620" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <img src="assets/img/logo-tuyomall-nav.png" alt="Logo TuyoMall">
      </span>
      <span>Tuyo<span class="brand-mall">Mall
        <svg class="brand-underline" viewBox="0 0 46 7" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M2 4.5 C8 1.5, 16 6.5, 23 3.5 C30 0.5, 38 6, 44 3" stroke="#FF6B47" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span></span>
    </a>
    <div class="top-actions">
      <a class="ghost-link" id="backLink" href="acceso-cliente.html"><span class="ti ti-arrow-left"></span><span>Volver</span></a>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Cambiar modo"><span class="ti ti-moon"></span></button>
    </div>
  </header>

  <main class="wrap">
    <section class="copy">
      <p class="eyebrow"><span class="ti ti-shield-lock"></span> <span id="flowLabel">Seguridad cliente</span></p>
      <h1>Recupera tu <span>contrasena</span></h1>
      <p class="lead" id="flowLead">Escribe el correo de tu cuenta de cliente y te enviaremos un enlace seguro para crear una nueva contrasena.</p>
    </section>

    <section class="card" aria-label="Formulario para recuperar contrasena">
      <div class="icon-box"><span class="ti ti-key"></span></div>
      <h2>Enviar enlace</h2>
      <p id="cardHelp">Usa el correo con el que creaste tu cuenta de cliente.</p>

      <form id="recoveryForm" novalidate>
        <label for="recEmail">Correo de tu cuenta</label>
        <input id="recEmail" type="email" placeholder="tunegocio@correo.com" autocomplete="email" required>
        <div class="actions">
          <button class="btn btn-primary" type="submit"><span class="ti ti-send"></span> Enviar enlace</button>
          <button class="btn btn-ghost" type="button" id="btnCancelar">Cancelar</button>
        </div>
        <p id="recAlert" class="alert" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('recoveryForm');
    const email = document.getElementById('recEmail');
    const alertBox = document.getElementById('recAlert');
    const cancelBtn = document.getElementById('btnCancelar');
    const backLink = document.getElementById('backLink');
    const flowLabel = document.getElementById('flowLabel');
    const flowLead = document.getElementById('flowLead');
    const cardHelp = document.getElementById('cardHelp');
    const isBusiness = location.pathname.includes('emprendedor');
    const flow = isBusiness
      ? {
          label: 'Seguridad emprendedor',
          back: 'acceso-emprendedor.html',
          lead: 'Escribe el correo de tu cuenta de emprendedor y te enviaremos un enlace seguro para crear una nueva contrasena.',
          help: 'Usa el correo con el que creaste tu cuenta de emprendedor.',
          account: 'cuenta de emprendedor'
        }
      : {
          label: 'Seguridad cliente',
          back: 'acceso-cliente.html',
          lead: 'Escribe el correo de tu cuenta de cliente y te enviaremos un enlace seguro para crear una nueva contrasena.',
          help: 'Usa el correo con el que creaste tu cuenta de cliente.',
          account: 'cuenta de cliente'
        };

    document.title = `Recuperar contrasena ${isBusiness ? 'emprendedor' : 'cliente'} | TuyoMall`;
    backLink.href = flow.back;
    flowLabel.textContent = flow.label;
    flowLead.textContent = flow.lead;
    cardHelp.textContent = flow.help;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const value = email.value.trim();
      const submitButton = form.querySelector('button[type="submit"]');
      const originalButton = submitButton.innerHTML;
      alertBox.classList.add('show');

      if (!value || !email.checkValidity()) {
        alertBox.textContent = 'Escribe un correo valido para continuar.';
        return;
      }

      submitButton.disabled = true;
      submitButton.innerHTML = '<span class="ti ti-loader-2"></span> Enviando...';

      try {
        const data = new FormData();
        data.append('email', value);
        data.append('role', isBusiness ? 'emprendedor' : 'cliente');

        const response = await fetch('auth/request-password-reset.php', {
          method: 'POST',
          body: data
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || 'No pudimos enviar el enlace.');

        alertBox.textContent = result.message;
      } catch (error) {
        alertBox.textContent = error.message || 'No pudimos enviar el enlace. Intentá de nuevo.';
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = originalButton;
      }
    });

    cancelBtn.addEventListener('click', () => {
      email.value = '';
      alertBox.classList.remove('show');
      alertBox.textContent = '';
      email.focus();
    });
  </script>
</body>
</html>
